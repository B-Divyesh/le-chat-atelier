<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Chat Atelier</title>
<style>
:root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e1dc; --accent:#ff7000; --ok:#1a7f37; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1d1d20; --ink:#ececee; --muted:#9a9aa2; --line:#2e2e33; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; font-weight: 650; }
header .sub { color: var(--muted); font-size: 13px; }
#health { margin-left: auto; font-size: 12px; color: var(--muted); }
#health::before { content: "●"; margin-right: 6px; color: var(--muted); }
#health.ok::before { color: var(--ok); } #health.bad::before { color: var(--bad); }
main { max-width: 1120px; margin: 0 auto; padding: 18px 16px 48px; }
form { display: flex; gap: 8px; flex-wrap: wrap; }
#prompt { flex: 1 1 320px; min-width: 0; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
#prompt:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
#go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.controls { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
.controls select { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.controls input[type=range] { vertical-align: middle; accent-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
.chips button { padding: 5px 10px; font-size: 12px; border-radius: 999px; color: var(--muted); }
#summary { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.canvas { aspect-ratio: 1; background: #fff; display: grid; place-items: center; position: relative; }
.canvas img { width: 100%; height: 100%; object-fit: contain; display: block; }
.canvas .wait { position: absolute; color: #8a8a8f; font-size: 13px; }
.meta { padding: 8px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
.meta .status { flex: 1 1 100%; font-variant-numeric: tabular-nums; }
.meta a, .meta button { font-size: 12px; padding: 4px 9px; border-radius: 7px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: transparent; }
.meta a[aria-disabled=true] { pointer-events: none; opacity: .4; }
pre.code { display: none; margin: 0; max-height: 180px; overflow: auto; padding: 8px 10px; font-size: 11px; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-all; }
h2 { font-size: 14px; font-weight: 600; margin: 30px 0 10px; color: var(--muted); }
#history { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
#history button { padding: 0; border-radius: 8px; overflow: hidden; background: #fff; aspect-ratio: 1; }
#history img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<header>
  <h1>Le Chat Atelier</h1>
  <span class="sub">Ministral 3B → SVG, drawn live</span>
  <span id="health">checking GPU…</span>
</header>
<main>
  <form id="form">
    <input id="prompt" placeholder="Describe an illustration, e.g. a rocket ship flying to the moon" autocomplete="off" maxlength="500" autofocus>
    <button id="go" type="submit">Draw</button>
    <button id="stop" type="button" disabled>Stop</button>
  </form>
  <div class="controls">
    <label>Model
      <select id="model">
        <option value="distilled">Distilled fine-tune · fast, always valid</option>
        <option value="base">Base Ministral 3B</option>
        <option value="mmsvg">MMSVG fine-tune · dense paths</option>
      </select>
    </label>
    <label>Drawings
      <select id="count"><option>1</option><option>2</option><option selected>4</option><option>6</option></select>
    </label>
    <label>Temperature <input id="temp" type="range" min="0.2" max="1.2" step="0.1" value="0.7"> <span id="tempv">0.7</span></label>
  </div>
  <div class="chips" id="chips"></div>
  <div id="summary"></div>
  <div id="grid"></div>
  <h2>Recent</h2>
  <div id="history"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const SUGGEST = ["A rocket ship flying to the moon", "A smiling yellow sun", "An expansive desert at sunset", "A cute orange cat sitting",
                 "A lighthouse on a rocky coast", "A cup of hot coffee", "Stars in the dark night sky", "A red apple with a green leaf"];
const NS = "http://www.w3.org/2000/svg";
let controllers = [];

function completeSvg(text) {
  const start = text.indexOf("<svg");
  if (start < 0) return null;
  let body = text.slice(start);
  const end = body.indexOf("</svg>");
  if (end >= 0) body = body.slice(0, end + 6);
  else {
    const last = body.lastIndexOf(">");
    if (last < 0) return null;
    body = body.slice(0, last + 1);
    const stack = [], re = /<(\/?)([a-zA-Z][\w:-]*)\b[^>]*?(\/?)>/g;
    let m;
    while ((m = re.exec(body))) { if (m[1]) stack.pop(); else if (!m[3]) stack.push(m[2]); }
    body += stack.reverse().map(t => `</${t}>`).join("");
  }
  if (!/^<svg\b[^>]*xmlns=/.test(body)) body = body.replace("<svg", `<svg xmlns="${NS}"`);
  return body;
}
const dataUrl = svg => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

function makeTile() {
  const el = document.createElement("div"); el.className = "tile";
  el.innerHTML = `<div class="canvas"><span class="wait">waiting for the model…</span><img alt=""></div>
    <div class="meta"><span class="status">queued</span><a class="dl" download="atelier.svg" aria-disabled="true">Download</a>
    <button class="copy" type="button" disabled>Copy SVG</button><button class="show" type="button">Code</button></div><pre class="code"></pre>`;
  const t = { el, img: el.querySelector("img"), wait: el.querySelector(".wait"), status: el.querySelector(".status"),
              dl: el.querySelector(".dl"), copy: el.querySelector(".copy"), code: el.querySelector(".code"), svg: "" };
  el.querySelector(".show").onclick = () => { t.code.style.display = t.code.style.display === "block" ? "none" : "block"; };
  t.copy.onclick = async () => { try { await navigator.clipboard.writeText(t.svg); t.copy.textContent = "Copied"; } catch { t.copy.textContent = "Copy failed"; } };
  return t;
}

function paint(t, text) {
  const svg = completeSvg(text);
  t.code.textContent = text;
  if (!svg) return;
  t.svg = svg; t.img.src = dataUrl(svg); t.wait.style.display = "none";
}

async function draw(t, prompt, model, temperature, signal) {
  const t0 = performance.now();
  let text = "", firstShape = null, lastPaint = 0, done = null;
  const secs = () => (performance.now() - t0) / 1000;
  t.status.textContent = "connecting…";
  try {
    const res = await fetch("/generate", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, model, temperature }), signal });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.error) throw new Error(msg.error);
        if (msg.text) {
          text += msg.text;
          if (firstShape === null && /<(path|rect|circle|ellipse|polygon|polyline|line)\b[^>]*\/>/.test(text)) firstShape = secs();
          if (performance.now() - lastPaint > 90) { paint(t, text); lastPaint = performance.now(); }
          t.status.textContent = `drawing · ${secs().toFixed(1)} s`;
        }
        if (msg.done) done = msg;
      }
    }
    paint(t, text);
    const s = secs(), tokens = done ? done.tokens : null;
    t.status.textContent = `${s.toFixed(1)} s · ${tokens ?? "?"} tokens · ${tokens ? Math.round(tokens / s) : "?"} tok/s`
      + (firstShape !== null ? ` · first shape ${firstShape.toFixed(1)} s` : "") + (done && done.stopped === "loop" ? " · loop stopped" : "");
    if (t.svg) { t.dl.href = dataUrl(t.svg); t.dl.setAttribute("aria-disabled", "false"); t.copy.disabled = false; }
    else t.status.textContent += " · no drawable SVG";
    return t.svg ? { svg: t.svg, s } : null;
  } catch (e) {
    paint(t, text);
    t.status.textContent = e.name === "AbortError" ? "stopped" : "error: " + e.message;
    return null;
  }
}

function loadHistory() { try { return JSON.parse(localStorage.getItem("atelier.history") || "[]"); } catch { return []; } }
function saveHistory(items) { try { localStorage.setItem("atelier.history", JSON.stringify(items.slice(0, 18))); } catch {} }
function renderHistory() {
  const box = $("history"); box.replaceChildren();
  for (const h of loadHistory()) {
    const b = document.createElement("button"); b.type = "button"; b.title = `${h.prompt} (${h.model})`;
    const img = document.createElement("img"); img.alt = h.prompt; img.src = dataUrl(h.svg); b.append(img);
    b.onclick = () => { $("prompt").value = h.prompt; $("prompt").focus(); };
    box.append(b);
  }
}

async function run(prompt) {
  prompt = prompt.trim();
  if (!prompt) return;
  controllers.forEach(c => c.abort());
  const n = +$("count").value, model = $("model").value, temperature = +$("temp").value;
  const grid = $("grid"); grid.replaceChildren();
  const tiles = Array.from({ length: n }, makeTile);
  tiles.forEach(t => grid.append(t.el));
  controllers = tiles.map(() => new AbortController());
  $("go").disabled = true; $("stop").disabled = false;
  $("summary").textContent = `Drawing ${n} × “${prompt}” with ${$("model").selectedOptions[0].text.split(" ·")[0]}…`;
  const t0 = performance.now();
  const results = await Promise.all(tiles.map((t, i) => draw(t, prompt, model, temperature, controllers[i].signal)));
  const ok = results.filter(Boolean);
  $("summary").textContent = `${ok.length} of ${n} drawings in ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  $("go").disabled = false; $("stop").disabled = true;
  if (ok.length) { saveHistory([{ prompt, model, svg: ok[0].svg }, ...loadHistory()]); renderHistory(); }
}

$("form").onsubmit = e => { e.preventDefault(); run($("prompt").value); };
$("stop").onclick = () => controllers.forEach(c => c.abort());
$("temp").oninput = () => { $("tempv").textContent = (+$("temp").value).toFixed(1); };
for (const s of SUGGEST) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = s;
  b.onclick = () => { $("prompt").value = s; run(s); };
  $("chips").append(b);
}
async function health() {
  try {
    const ok = (await fetch("/health")).ok;
    $("health").textContent = ok ? "GPU ready" : "GPU starting"; $("health").className = ok ? "ok" : "bad";
  } catch { $("health").textContent = "server unreachable"; $("health").className = "bad"; }
}
health(); setInterval(health, 15000); renderHistory();
</script>
</body>
</html>
